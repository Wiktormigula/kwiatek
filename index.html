<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Róża z liter</title>
<style>
:root { color-scheme: dark; --bg: #05060b; --dim: #6b7089; }
html, body { height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
body { display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
canvas { display: block; max-width: 100%; }
p { position: fixed; left: 16px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); margin: 0; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="Rozkwitająca róża narysowana literami"></canvas>
<p>Przesuń kursor, żeby zmienić kierunek światła.</p>
<script>
const cv = document.getElementById('c');
const gMain = cv.getContext('2d');
const art = document.createElement('canvas'), g = art.getContext('2d');
const mid = document.createElement('canvas'), gm = mid.getContext('2d');
const low = document.createElement('canvas'), gl = low.getContext('2d');
const RAMP = ' .,:;-=+*ixnX#%@';
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2, HEAD = 0.22, LOOP = 22;
let W, H, cw, ch, cols, rows, S;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.min(innerWidth, 780); H = Math.min(innerHeight, 720);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cv.width = art.width = W * dpr; cv.height = art.height = H * dpr;
  mid.width = Math.ceil(W / 4); mid.height = Math.ceil(H / 4);
  low.width = Math.ceil(W / 14); low.height = Math.ceil(H / 14);
  gMain.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const fs = Math.max(9, Math.min(15, Math.round(W / 95)));
  g.font = fs + 'px ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  cw = g.measureText('M').width; ch = fs * 1.15;
  cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
  S = Math.min(H * 0.40, W * 0.46);
  depth = new Float32Array(cols * rows); lum = new Float32Array(cols * rows);
  kind = new Uint8Array(cols * rows); fr = new Float32Array(cols * rows);
}
let depth, lum, kind, fr;

const smooth = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0) % 1000 / 1000;

// light follows the pointer
let L = [-0.5, 0.6, 0.65], target = L.slice();
const norm = v => { const n = Math.hypot(...v); return v.map(a => a / n); };
addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  target = norm([((e.clientX - r.left) / W - 0.5) * 2.6, -((e.clientY - r.top) / H - 0.5) * 2.6, 0.6]);
});

// geometry buffers
const NU = 30, NV = 15, LAYERS = [3, 4, 5, 5, 6, 7];
const NP = LAYERS.reduce((a, n) => a + n, 0) * NU * NV;
const NS = 140 * 10, NL = 2 * 40 * 15;
const N = NP + NS + NL;
const P = new Float32Array(N * 3), NR = new Float32Array(N * 3);
const KIND = new Uint8Array(N), F = new Float32Array(N), VIS = new Uint8Array(N), DT = new Float32Array(N).fill(1);

function normals(off, nu, nv, flip) {
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const a1 = off + Math.min(i + 1, nu - 1) * nv + j, a0 = off + Math.max(i - 1, 0) * nv + j;
    const b1 = off + i * nv + Math.min(j + 1, nv - 1), b0 = off + i * nv + Math.max(j - 1, 0);
    const ax = P[a1 * 3] - P[a0 * 3], ay = P[a1 * 3 + 1] - P[a0 * 3 + 1], az = P[a1 * 3 + 2] - P[a0 * 3 + 2];
    const bx = P[b1 * 3] - P[b0 * 3], by = P[b1 * 3 + 1] - P[b0 * 3 + 1], bz = P[b1 * 3 + 2] - P[b0 * 3 + 2];
    let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
    const m = Math.hypot(nx, ny, nz) + 1e-9; nx /= m; ny /= m; nz /= m;
    const k = off + i * nv + j;
    if (flip(k, nx, ny, nz)) { nx = -nx; ny = -ny; nz = -nz; }
    NR[k * 3] = nx; NR[k * 3 + 1] = ny; NR[k * 3 + 2] = nz;
  }
}

// stem and leaves
const stemAt = s => [0.045 * Math.sin(s * 3.1 + 0.4) - 0.02, -1.15 + s * (HEAD + 1.15), 0.02 * Math.sin(s * 2)];
function buildStem() {
  const off = NP;
  for (let i = 0; i < 140; i++) {
    const s = i / 139, c = stemAt(s), r = 0.026 + 0.006 * (1 - s);
    for (let j = 0; j < 10; j++) {
      const a = j / 10 * TAU, k = off + i * 10 + j;
      P[k * 3] = c[0] + Math.cos(a) * r; P[k * 3 + 1] = c[1]; P[k * 3 + 2] = c[2] + Math.sin(a) * r;
      NR[k * 3] = Math.cos(a); NR[k * 3 + 1] = 0; NR[k * 3 + 2] = Math.sin(a);
      KIND[k] = 0; F[k] = s;
    }
  }
}
const LEAF = [{ at: 0.30, side: -1, len: 0.42, lift: 0.35 }, { at: 0.55, side: 1, len: 0.36, lift: 0.45 }];
function buildLeaves(grow) {
  LEAF.forEach((lf, n) => {
    const off = NP + NS + n * 40 * 15;
    const sc = smooth((grow - lf.at - 0.03) / 0.22);
    const base = stemAt(lf.at);
    const dx = lf.side * Math.cos(lf.lift), dy = Math.sin(lf.lift);
    for (let i = 0; i < 40; i++) for (let j = 0; j < 15; j++) {
      const s = i / 39, w = j / 14 * 2 - 1, k = off + i * 15 + j;
      const hw = 0.19 * Math.pow(Math.sin(Math.PI * s), 0.75) * lf.len / 0.42;
      const along = s * lf.len * sc;
      P[k * 3] = base[0] + dx * (0.05 + along);
      P[k * 3 + 1] = base[1] + dy * (0.05 + along) - 0.11 * (s * lf.len * sc) ** 2 / 0.2 * 0.5 + 0.05 * Math.abs(w) * hw / 0.14 * sc;
      P[k * 3 + 2] = base[2] + w * hw * sc;
      KIND[k] = 1; F[k] = lf.at + 0.03 + s * 0.2; VIS[k] = sc > 0.02 ? 1 : 0;
    }
    normals(off, 40, 15, (k, nx, ny) => ny < 0);
  });
}

// the bloom: layers of curled petals
function buildPetals(op, sc) {
  let off = 0;
  LAYERS.forEach((n, k) => {
    const f = k / 5, Lk = (0.26 + 0.28 * f) * sc, r0 = (0.028 + 0.036 * k) * sc, ok = smooth((op - 0.5 * (1 - f)) / 0.5);
    const rr = new Float32Array(NU), yy = new Float32Array(NU);
    let r = r0, y = HEAD + 0.07 - 0.05 * f;
    for (let u = 0; u < NU; u++) {
      const t = u / (NU - 1);
      const closed = 0.38 - 1.0 * Math.pow(t, 1.1) - 0.15 * f;
      const open = 0.08 + 0.3 * f + (0.22 + 0.85 * f) * Math.pow(t, 1.45) + 0.7 * f * Math.pow(t, 3.2);
      const beta = lerp(closed, open, ok);
      rr[u] = r; yy[u] = y;
      r += Math.max(0, Math.sin(beta)) * Lk / (NU - 1) + Math.min(0, Math.sin(beta)) * Lk / (NU - 1) * 0.8;
      y += Math.cos(beta) * Lk / (NU - 1);
      r = Math.max(r, 0.004);
    }
    const half = Math.PI / n * (1.7 - 0.35 * ok * f);
    for (let p = 0; p < n; p++) {
      const tc = p * TAU / n + k * 0.9 + k * k * 0.31;
      for (let u = 0; u < NU; u++) for (let v = 0; v < NV; v++) {
        const t = u / (NU - 1), vv = v / (NV - 1) * 2 - 1;
        const wd = 0.55 + 0.45 * Math.sin(Math.PI * (0.15 + 0.85 * t));
        const th = tc + vv * half * wd;
        const re = rr[u] * (1 - 0.12 * vv * vv) * (1 + 0.05 * ok * Math.abs(vv) * Math.sin(t * 9 + p * 2));
        const ye = yy[u] + 0.08 * vv * vv * Lk * (0.4 + ok);
        const q = off + p * NU * NV + u * NV + v;
        P[q * 3] = re * Math.sin(th); P[q * 3 + 1] = ye; P[q * 3 + 2] = re * Math.cos(th);
        KIND[q] = 2; F[q] = f; VIS[q] = sc > 0.03 ? 1 : 0;
        DT[q] = (0.4 + 0.85 * Math.pow(t, 0.7)) * (0.55 + 0.45 * (1 - Math.pow(Math.abs(vv), 2.5))) * (0.88 + 0.12 * Math.sin(p * 2.7 + k));
      }
      normals(off + p * NU * NV, NU, NV, (kk, nx, ny, nz) => nx * P[kk * 3] + nz * P[kk * 3 + 2] < 0);
    }
    off += n * NU * NV;
  });
}
buildStem();

function frameAt(t, Lv) {
  const tt = t % LOOP;
  const grow = smooth(tt / 3.6);
  const sc = smooth((tt - 2.6) / 2.4);
  const op = smooth((tt - 4.5) / 11);
  buildPetals(op, sc);
  buildLeaves(grow);
  for (let i = 0; i < NS; i++) VIS[NP + i] = F[NP + i] <= grow * 1.0 ? 1 : 0;

  const yaw = 0.55 * Math.sin(tt * 0.35 + 0.5) * smooth((tt - 2) / 3), tilt = 0.6;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), ct = Math.cos(tilt), st = Math.sin(tilt);
  const rot = (x, y, z) => { const x1 = cy * x + sy * z, z1 = -sy * x + cy * z; return [x1, y * ct - z1 * st, y * st + z1 * ct]; };
  const hv = norm([Lv[0], Lv[1], Lv[2] + 1]);
  const rim = norm([Math.cos(tt * 0.8), 0.35, Math.sin(tt * 0.8) - 0.3]);
  const hr = norm([rim[0], rim[1], rim[2] + 1]);
  depth.fill(-1e9); lum.fill(0); kind.fill(0);
  const hit = (x, y, z, l, kd, f) => {
    const f2 = 4.5 / (4.5 - z);
    const i = Math.floor((W / 2 + x * S * f2) / cw), j = Math.floor((H * 0.56 - y * S * f2) / ch);
    if (i < 0 || i >= cols || j < 0 || j >= rows) return;
    const c = j * cols + i;
    if (z > depth[c]) { depth[c] = z; lum[c] = l; kind[c] = kd; fr[c] = f; }
  };
  for (let k = 0; k < N; k++) {
    if (!VIS[k]) continue;
    const p = rot(P[k * 3], P[k * 3 + 1] - 0.1, P[k * 3 + 2]);
    const n = rot(NR[k * 3], NR[k * 3 + 1], NR[k * 3 + 2]);
    if (n[2] < 0) { n[0] = -n[0]; n[1] = -n[1]; n[2] = -n[2]; }   // light both sides of a petal
    const d = Math.max(0, n[0] * Lv[0] + n[1] * Lv[1] + n[2] * Lv[2]);
    const sp = Math.pow(Math.max(0, n[0] * hv[0] + n[1] * hv[1] + n[2] * hv[2]), 22);
    const kd = KIND[k], f = F[k];
    const dr = Math.max(0, n[0] * rim[0] + n[1] * rim[1] + n[2] * rim[2]);
    const sr = Math.pow(Math.max(0, n[0] * hr[0] + n[1] * hr[1] + n[2] * hr[2]), 14);
    let l = 0.2 + 0.62 * d + 0.7 * sp + 0.28 * dr * dr + 0.45 * sr;
    if (kd === 2) l *= (0.8 + 0.2 * f) * DT[k];
    hit(p[0], p[1], p[2], Math.min(1.6, l), kd + 1, f);
  }
  // dew glints on the outer petals
  if (op > 0.8) for (let q = 0; q < 14; q++) {
    const idx = Math.floor(hash(q, 7) * (LAYERS[5] * NU * NV)) + (NP - LAYERS[5] * NU * NV);
    if (Math.sin(tt * 3 + q * 2.3) > 0.7) {
      const p = rot(P[idx * 3], P[idx * 3 + 1] - 0.1, P[idx * 3 + 2]); hit(p[0], p[1], p[2] + 0.02, 1.5, 4, 1);
    }
  }
  // drifting dust
  const dust = smooth((tt - 1) / 2);
  for (let q = 0; q < 220; q++) {
    const a = hash(q, 1) * TAU + tt * 0.06, r = 0.5 + 1.2 * hash(q, 2);
    const y = ((hash(q, 3) * 2.4 + tt * 0.05) % 2.4) - 1.3;
    const tw = Math.pow(Math.max(0, Math.sin(tt * (1 + 2 * hash(q, 4)) + q * 5)), 6);
    if (tw * dust < 0.15) continue;
    const p = rot(Math.cos(a) * r, y, Math.sin(a) * r * 0.6 - 0.7);
    hit(p[0], p[1], p[2] - 2, 0.3 + 0.7 * tw, 5, 0);
  }
  return op;
}

const colors = new Map();
function css(r, gr, b) {
  const key = ((r >> 3) << 10) | ((gr >> 3) << 5) | (b >> 3);
  let s = colors.get(key);
  if (!s) { s = 'rgb(' + (r & 248) + ',' + (gr & 248) + ',' + (b & 248) + ')'; colors.set(key, s); }
  return s;
}

let last = 0, clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (now - last < 33) return;
  clock += still ? 0 : Math.min((now - last) / 1000, 0.1);
  last = now;
  for (let a = 0; a < 3; a++) L[a] = lerp(L[a], target[a], 0.06);
  frameAt(still ? 14 : clock, norm(L));
  g.fillStyle = '#06050a'; g.fillRect(0, 0, W, H);
  const glints = [];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const c = j * cols + i, kd = kind[c];
    if (!kd) continue;
    let l = lum[c];
    const raw = l;
    if (kd < 4 && (i === 0 || !kind[c - 1] || !kind[c + 1] || j === 0 || !kind[c - cols] || !kind[c + cols])) l = Math.max(l, 0.55) * 1.1;
    l = Math.min(1, l * 1.25);
    let ci = Math.min(RAMP.length - 1, Math.floor(l * (RAMP.length - 1) + 0.5));
    let r, gr, b;
    if (kd === 3) {
      const f = fr[c], m = 0.4 + 0.6 * l, w = Math.max(0, raw - 0.95) * 0.9;
      r = lerp(215, 255, f) * m + 255 * w; gr = lerp(24, 100, f) * m + 230 * w; b = lerp(66, 150, f) * m + 240 * w;
      if (raw > 1.35) { ci = 8; glints.push([raw, i, j]); }
    } else if (kd === 1 || kd === 2) { const m = 0.3 + 0.55 * l; r = 40 * m; gr = (kd === 1 ? 170 : 190) * m; b = 80 * m; }
    else { ci = l > 0.8 ? 8 : l > 0.45 ? 7 : 1; r = 255 * l; gr = (kd === 4 ? 255 : 200) * l; b = (kd === 4 ? 255 : 220) * l; if (kd === 4) glints.push([2, i, j]); }
    if (ci === 0) continue;
    g.fillStyle = css(Math.min(255, r) | 0, Math.min(255, gr) | 0, Math.min(255, b) | 0);
    g.fillText(RAMP[ci], (i + 0.5) * cw, (j + 0.5) * ch);
  }
  // four-pointed rays on the brightest glints
  glints.sort((a, b) => b[0] - a[0]);
  const rayed = [];
  for (const q of glints) {
    if (rayed.length >= 3) break;
    if (rayed.every(r => Math.hypot((r[1] - q[1]) * 2, r[2] - q[2]) > 10)) rayed.push(q);
  }
  rayed.forEach(([, i, j], n) => {
    const reach = 2 + Math.round(2 * (0.5 + 0.5 * Math.sin(clock * 5 + n * 1.7)));
    for (let d = 1; d <= reach; d++) {
      const v = 0.8 * (1 - d / (reach + 1)), col = css((255 * v) | 0, (235 * v) | 0, (245 * v) | 0);
      g.fillStyle = col;
      g.fillText('-', (i + 0.5 + d * 2) * cw, (j + 0.5) * ch); g.fillText('-', (i + 0.5 - d * 2) * cw, (j + 0.5) * ch);
      if (d <= 2) { g.fillText('|', (i + 0.5) * cw, (j + 0.5 + d) * ch); g.fillText('|', (i + 0.5) * cw, (j + 0.5 - d) * ch); }
    }
  });
  // glow: shrink the picture twice and add it back, soft
  gm.drawImage(art, 0, 0, mid.width, mid.height);
  gl.drawImage(mid, 0, 0, low.width, low.height);
  gMain.globalCompositeOperation = 'source-over';
  gMain.drawImage(art, 0, 0, W, H);
  gMain.globalCompositeOperation = 'lighter';
  gMain.globalAlpha = 0.55; gMain.drawImage(mid, 0, 0, W, H);
  gMain.globalAlpha = 0.9; gMain.drawImage(low, 0, 0, W, H);
  gMain.globalAlpha = 1; gMain.globalCompositeOperation = 'source-over';
}
resize();
addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
